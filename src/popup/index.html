<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WhatsApp Assistant</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="popup-container">
    <header class="popup-header">
      <div class="header-branding">
        <div class="logo-shield">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="popupGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#00FFA3" />
                <stop offset="45%" stop-color="#25D366" />
                <stop offset="100%" stop-color="#00D2FF" />
              </linearGradient>
            </defs>
            <path d="M12 1.5L21.5 4.8V11.8C21.5 17.5 17.2 22 12 23.2C6.8 22 2.5 17.5 2.5 11.8V4.8L12 1.5Z" fill="url(#popupGrad)" stroke="#ffffff" stroke-width="0.8" stroke-linejoin="round"/>
            <path d="M12 5.5C8.4 5.5 5.5 8.4 5.5 12C5.5 13.2 5.85 14.3 6.45 15.25L5.5 18.5L8.75 17.75C9.7 18.4 10.8 18.5 12 18.5C15.6 18.5 18.5 15.6 18.5 12C18.5 8.4 15.6 5.5 12 5.5Z" fill="#111b21"/>
            <path d="M14.2 13.5c-.15-.08-.9-.45-1.04-.5-.14-.05-.24-.08-.34.08-.1.15-.39.5-.48.6-.09.1-.18.12-.33.04-.15-.08-.64-.24-1.22-.76-.45-.4-.76-.9-.85-1.05-.09-.15-.01-.23.07-.31.07-.07.15-.18.23-.27.08-.09.1-.15.15-.25.05-.1.03-.19-.01-.27-.04-.08-.34-.83-.47-1.13-.12-.3-.25-.26-.34-.26-.09 0-.19 0-.29 0-.1 0-.27.04-.41.19-.14.15-.53.52-.53 1.27 0 .75.55 1.48.62 1.58.08.1 1.07 1.64 2.6 2.3.36.16.65.25.87.32.36.12.7.1 .96.06.3-.04.9-.37 1.03-.73.13-.36.13-.66.09-.73-.04-.06-.14-.1-.29-.18z" fill="#FFFFFF"/>
          </svg>
        </div>
        <div>
          <h1 class="popup-title">WhatsApp Assistant</h1>
          <span class="popup-version">v2.1.0 &bull; Screen Shield</span>
        </div>
      </div>
    </header>

    <div class="card master-card" id="masterCard" data-active="false">
      <div class="card-info">
        <div class="card-icon" id="masterIcon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
        </div>
        <div>
          <strong class="card-title">Master Privacy Shield</strong>
          <span class="card-subtitle" id="masterStatus">Disabled</span>
        </div>
      </div>
      <button type="button" class="switch" id="masterToggle" aria-pressed="false">
        <span class="switch-track"><span class="switch-thumb"></span></span>
      </button>
    </div>

    <div class="card safe-mode-card">
      <div class="card-info">
        <div class="card-icon safe-icon">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect><line x1="8" y1="21" x2="16" y2="21"></line><line x1="12" y1="17" x2="12" y2="21"></line><circle cx="12" cy="10" r="2"></circle></svg>
        </div>
        <div>
          <div class="title-with-badge">
            <strong class="card-title">Safe Screen-Share</strong>
            <span class="badge">PRO</span>
          </div>
          <span class="card-subtitle">Lock blur & prevent hover reveal</span>
        </div>
      </div>
      <button type="button" class="switch" id="safeModeToggle" aria-pressed="false">
        <span class="switch-track"><span class="switch-thumb"></span></span>
      </button>
    </div>

    <div class="status-summary" id="statusSummary">
      <span>Shortcut: <kbd>Ctrl</kbd> + <kbd>Shift</kbd> + <kbd>U</kbd></span>
    </div>

    <button type="button" class="btn-open-wa" id="btnOpenWA">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg>
      <span>Open WhatsApp Web</span>
    </button>
  </div>

  <script type="module" src="./index.ts"></script>
</body>
</html>
